<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@solana reply generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .card {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #9945FF;
    margin-bottom: 32px;
    letter-spacing: -.02em;
  }
  button {
    background: linear-gradient(135deg, #9945FF, #14F195);
    color: #fff;
    font-size: 1.1rem;
    font-weight: 600;
    border: none;
    border-radius: 40px;
    padding: 14px 40px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 4px 20px rgba(153,69,255,.3);
  }
  button:hover { transform: scale(1.04); box-shadow: 0 6px 28px rgba(153,69,255,.45); }
  button:active { transform: scale(.97); }
  .reply {
    margin-top: 28px;
    font-size: 1.3rem;
    font-weight: 500;
    min-height: 3em;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #14F195;
    transition: opacity .15s;
  }
  .reply.fade { opacity: 0; }
  .reply.legendary { color: #ffd700; }
  .secondary {
    background: transparent;
    color: #888;
    font-size: .85rem;
    font-weight: 500;
    border: 1px solid #333;
    border-radius: 40px;
    padding: 8px 20px;
    cursor: pointer;
    transition: all .15s;
    margin-top: 16px;
  }
  .secondary:hover {
    color: #aaa;
    border-color: #555;
  }
  .secondary:active { transform: scale(.97); }
</style>
</head>
<body>
<div class="card">
  <h1>@solana reply generator</h1>
  <button id="btn">Get follows</button>
  <div class="reply" id="reply"></div>
  <button id="replyBtn" class="secondary">reply to @solana</button>
</div>
<script>
  const prefixes = [
    "gm",
    "respectfully",
    "many are saying",
    "looking into this",
    "few understand",
    "source: trust me bro",
    "bullish",
    "bearish",
    "concerning",
    "huge if true",
    "interesting",
    "the goblins approve",
  ];

  const subjects = [
    "this",
    "the chart",
    "the roadmap",
    "the timeline",
    "the market",
    "this thesis",
    "the vibes",
    "the token",
    "the discourse",
    "this post",
    "the attention economy",
    "proof of attention",
  ];

  const endings = [
    "wagmi",
    "ngmi",
    "soon™",
    "absolute cinema",
    "skill issue",
    "many such cases",
    "we are so back",
    "it's never been more over",
    "proof of vibes",
    "future historians will study this",
    "transaction failed successfully",
    "the voices have updated guidance",
  ];

  const legendary = [
    "@solana follow me and I'll ship this",
    "I built a reply generator to get this follow",
    "the follow was inside us all along",
    "tokenizing this interaction",
    "this reply is optimized for engagement extraction",
    "validator missed slot",
    "follow probability: 0.0001%",
  ];

  function generateReply() {
    if (Math.random() < 0.03) {
      return { text: legendary[Math.floor(Math.random() * legendary.length)], legendary: true };
    }

    const p = prefixes[Math.floor(Math.random() * prefixes.length)];
    const s = subjects[Math.floor(Math.random() * subjects.length)];
    const e = endings[Math.floor(Math.random() * endings.length)];

    return { text: `${p} ${s} ... ${e}`, legendary: false };
  }

  let attempts = 0;
  let lastText = "";
  const replyEl = document.getElementById('reply');

  document.getElementById('replyBtn').addEventListener('click', () => {
    if (lastText) {
      window.open(`https://x.com/intent/post?in_reply_to=2060632805856457135&text=${encodeURIComponent(lastText)}`, '_blank');
    }
  });

  document.getElementById('btn').addEventListener('click', () => {
    attempts++;

    if (attempts === 25) {
      lastText = "@solana now follows you (unverified)";
      replyEl.textContent = lastText;
      replyEl.className = "reply";
      return;
    }

    replyEl.classList.add('fade');
    setTimeout(() => {
      const result = generateReply();
      lastText = result.text;
      replyEl.textContent = lastText;
      replyEl.className = result.legendary ? "reply legendary" : "reply";
      setTimeout(() => replyEl.classList.remove('fade'), 20);
    }, 120);
  });
</script>
</body>
</html>
